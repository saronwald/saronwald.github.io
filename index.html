<!DOCTYPE html>
<html>
<head>
  <title>Sam Aronwald Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px 20px;
    }

    h1 {
      letter-spacing: 2px;
      font-weight: 400;
    }

    p {
      opacity: 0.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    img {
      width: 100%;
      height: auto;
    }

    footer {
      padding: 40px;
      font-size: 14px;
      opacity: 0.5;
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Sam Aronwald</h1>
  <p>Freelance Photographer</p>
</header>

<section class="gallery">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
</section>

<footer>
  <p>Contact: <a href="mailto:saronwald@gmail.com">saronwald@gmail.com</a></p>
</footer>

</body>
</html>
